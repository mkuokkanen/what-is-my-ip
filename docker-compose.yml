# Docker Compose file for local development purposes.
services:
  app:
    image: what-is-my-ip:latest
    build:
      context: .
    environment:
      LOG_LEVEL: "debug"
      LOG_HEADERS: "true"
    ports:
      - '8080:8080'
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
