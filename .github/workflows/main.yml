name: Test, build and push docker image

# Runs unit tests on main, then builds and pushes the docker image.
on:
  push:
    branches: [ "main" ]

# Default GITHUB_TOKEN to read-only access.
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    #- name: Set up QEMU
    #  uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image and push it to GitHub registry
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        #platforms: linux/amd64,linux/arm64
        platforms: linux/amd64
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/what-is-my-ip:latest
