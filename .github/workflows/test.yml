name: Test

# Runs unit tests on every branch except main.
# Also called from main.yml before the docker image is built.
on:
  push:
    branches-ignore: [ "main" ]
  workflow_call:

# Default GITHUB_TOKEN to read-only access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.2-noble

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run unit tests
      run: swift test
